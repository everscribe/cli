version: 2
project_name: es

before:
  hooks:
    - go mod tidy

builds:
  - id: es
    main: ./cmd/es
    binary: es
    env:
      - CGO_ENABLED=0
    goos: [darwin, linux, windows]
    goarch: [amd64, arm64]
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w -X main.version=v{{.Version}}

archives:
  - name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude: ['^docs:', '^test:', '^chore:', '^style:']

homebrew_casks:
  - name: es
    binaries: [es]
    repository:
      owner: everscribe
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    homepage: "https://everscribe.io"
    description: "Command-line interface for Everscribe"
    # Binaries are not notarized, so drop quarantine or Gatekeeper calls them damaged.
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/es"]
          end
